# THROWAWAY: runs only on its own PR and is never merged (GUIDE Stage B inventory).
# Read-only: lists and classifies file names on the self-hosted runner.
name: inventory
on:
  pull_request:
    paths: ['.github/workflows/inventory.yml', 'tools/inventoryRunnerData.ps1']
permissions:
  contents: read
jobs:
  inventory:
    name: runner data inventory
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inventory (read-only)
        shell: powershell
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        run: ./tools/inventoryRunnerData.ps1
