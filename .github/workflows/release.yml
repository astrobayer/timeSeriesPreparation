name: release

# Tags and releases on merge (GUIDE §3, ci-actions VERSIONING.md).
# mode: file - Contents.m is the one version authority; a merge whose
# Contents.m names a version without a tag gets an annotated tag on the
# merge commit and a GitHub release. Any other merge releases nothing.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astrobayer/ci-actions/matlab-release@v1.3.2
        with:
          mode: file
          version-file: +timeSeriesPreparation/Contents.m
