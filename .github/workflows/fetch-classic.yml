# THROWAWAY: runs only on its own PR and is never merged (GUIDE Stage B, D-8 classic GRACE).
# Writes into the owner's DATAPOOL (READING_DATA_POOL); never overwrites or deletes an existing file.
name: fetch-classic
on:
  pull_request:
    paths: ['.github/workflows/fetch-classic.yml', 'tools/fetchClassic.ps1']
permissions:
  contents: read
concurrency:
  group: fetch-pool-data
  cancel-in-progress: false
jobs:
  fetch:
    name: fetch D-8 (classic GRACE RL03)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch (idempotent, no overwrite)
        shell: powershell
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        run: ./tools/fetchClassic.ps1 -Months '2008-07,2012-01,2017-01' -RL02Months '2008-07,2012-01,2017-01' -Transplant
