# Continuous integration for timeSeriesPreparation (X-00b).
#
# TWO JOBS, AND THEIR NAMES ARE THE REQUIRED CONTEXTS
#   `audit` and `matlab` are the contexts GUIDE section 2 names for this
#   repository. O-2 (HANDOVER) adds them to the `Main Protection` ruleset
#   once this workflow has run once and created them. Renaming a job renames
#   its context, so the names are fixed from here on.
#
# audit - ubuntu-latest, no MATLAB
#   The shared static audit (ci-actions C-01) and the shared documentation
#   generator in check mode (C-03). Both read .github/*.json. Runs first and
#   needs nothing installed, so a broken help block never consumes the single
#   self-hosted runner.
#
# matlab - the self-hosted Windows runner
#   Probe, then the gate (timeSeriesPreparationCiGate). gracefoReading is an
#   OPTIONAL dependency (CONCEPT 3.1): it is checked out into
#   deps/gracefoReading at its release tag when REFERENCE_READ_TOKEN is
#   visible, so the "present" branch of the resolution is exercised; without
#   the secret the step is skipped and the one test that needs it is counted
#   incomplete, never silently passed.
#   lsqvce is a TEST-ONLY dependency (CONCEPT 10.1 X-07, Q12): checked out
#   into deps/lsqvce the same way, for the agreement test between the
#   sigtools numerics and lsqvce's kernels. No toolbox function calls it.
#   The DATAPOOL root on the runner reaches the tests as an environment
#   variable. Since 1.5.2 (the owner's data pool rule, toolboxInstaller
#   docs/DATA_POOL.md) tests/dataPoolRoot.m reads DATAPOOL first and
#   READING_DATA_POOL only when DATAPOOL is unset or empty. This workflow
#   sets only READING_DATA_POOL, from the organisation variable of that name
#   (HANDOVER F 2026-09-19), so a DATAPOOL in the runner's own environment
#   wins over it. The pool tests (D-9, X-12, V-4, X-13, X-17) count as
#   incomplete when neither variable is set, never silently passed.
#   Read-only: no test writes below it.
#
# PINS
#   ci-actions by immutable tag (its README: a moving tag would change this
#   CI with nothing in this diff to explain it); third-party actions by
#   commit SHA with the tag beside it, the SHAs gracefoReading's ci.yml runs.
#
# Created: 2026-09-22
# Author:  Developed by Matthias Weigelt with the help of Anthropic
#          Claude Code, 2026-09-22

name: ci

on:
  # push limited to main: an unrestricted push next to pull_request fires
  # both events for every commit on a branch with an open PR (measured in
  # gracefoReading), and the second run queues behind the first on the one
  # self-hosted runner.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "auto | a8 | hosted - narrows the routing, never widens it"
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where may MATLAB run for this event: A8, a GitHub-hosted runner, or
  # nowhere? One decision for the whole organisation, in
  # astrobayer/ci-actions (ci-route; docs/CI_GUIDE.md section 2): members
  # only, no forks, A8 from a public repository only for the allow-listed
  # user. This job never fails - a refusal arrives in the MATLAB job as
  # runner=none and matlab-setup turns that required context red.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      runs-on: ${{ steps.route.outputs.runs-on }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: route
        uses: astrobayer/ci-actions/ci-route@v1.4.0
        with:
          policy: ${{ vars.CI_MATLAB_RUNNER }}
          request: ${{ github.event.inputs.runner }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astrobayer/ci-actions/matlab-audit@v1.3.2
        with:
          config: .github/matlab-audit.json

      - uses: astrobayer/ci-actions/matlab-docs@v1.3.2
        with:
          config: .github/matlab-docs.json

  matlab:
    needs: [route]
    name: matlab
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    # 60: the gate took 27 min 7 s at X-05 PR-C (run 36033100696, 622 tests
    # with the D-9 DATAPOOL reads) against the former 30 (HANDOVER O-6).
    timeout-minutes: 60
    env:
      # A secret cannot be tested in a step's `if:` directly; its presence can.
      HAVE_REFERENCE_TOKEN: ${{ secrets.REFERENCE_READ_TOKEN != '' }}
      # The DATAPOOL root for the real-day tests; read-only. The fallback
      # name: tests/dataPoolRoot.m reads DATAPOOL first, then this.
      READING_DATA_POOL: ${{ needs.route.outputs.runner == 'a8' && vars.READING_DATA_POOL || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # timeout-minutes sits here, not in the action: the composite schema
      # rejects the key on a step (ci-actions README, measured).
      # MATLAB on the routed runner: probed on A8, installed by setup-matlab on a
      # GitHub-hosted runner (public repositories only), or a red step quoting
      # the routing refusal. Replaces matlab-probe; same immutable-tag rule.
      - uses: astrobayer/ci-actions/matlab-setup@v1.4.0
        timeout-minutes: 15
        with:
          runner: ${{ needs.route.outputs.runner }}
          reason: ${{ needs.route.outputs.reason }}
          products: ${{ vars.CI_MATLAB_PRODUCTS }}

      # Pinned to a release tag: the minimum version this repository is
      # tested against moves in the PR that needs a newer one (GUIDE 3).
      - name: Check out gracefoReading (optional dependency)
        if: ${{ env.HAVE_REFERENCE_TOKEN == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/gracefoReading
          ref: v1.3.0
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          path: deps/gracefoReading

      # Test-only (Q12); pinned like gracefoReading.
      - name: Check out lsqvce (test-only dependency)
        if: ${{ env.HAVE_REFERENCE_TOKEN == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/lsqvce
          ref: v7.0.1
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          path: deps/lsqvce

      - name: MATLAB gate
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: timeSeriesPreparationCiGate

      - name: Publish test report and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testresults-self-hosted-windows
          path: artifacts/
