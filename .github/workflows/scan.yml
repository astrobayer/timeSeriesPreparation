# THROWAWAY: runs only on its own PR and is never merged (GUIDE D-9 / CONCEPT V-12).
# Fetches the GRACE-FO L1B RL04 archives of a second month into the owner's DATAPOOL
# (never overwrites or deletes; source MD5 verified), then scans them read-only for defect candidates.
name: scan-defects
on:
  pull_request:
    paths: ['.github/workflows/scan.yml', 'tools/scanDefectCandidates.m', 'tools/fetchPoolData.ps1']
permissions:
  contents: read
concurrency:
  group: scan-defects
  cancel-in-progress: false
jobs:
  fetch:
    name: fetch L1B 2020-07
    runs-on: [self-hosted, Windows]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch (idempotent, no overwrite, L1B only)
        shell: powershell
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        run: ./tools/fetchPoolData.ps1 -Month 2020-07 -SkipItsg

  scan:
    name: defect candidates 2020-07
    needs: fetch
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out gracefoReading
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/gracefoReading
          ref: v1.1.0
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          path: deps/gracefoReading

      - name: Scan (read-only)
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        with:
          command: addpath(genpath('deps/gracefoReading')); addpath('tools'); scanDefectCandidates(getenv('READING_DATA_POOL'), "2020-07")

      - name: Publish scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: defect-scan-2020-07
          path: artifacts/
