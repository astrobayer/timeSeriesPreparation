# THROWAWAY: runs only on its own PR and is never merged (X-12 scan, owner decisions 2026-09-27).
# Downloads GRACE-FO Level-1A RL04 days from ISDC into the owner's DATAPOOL (GRACEFO\L1A\RL04\<yyyy>\<day>\)
# and compares the CRN-filtered ACC Level-1A with ACT1B.
name: scan-l1a
on:
  pull_request:
    paths: ['.github/workflows/scan.yml', 'tools/scanL1A.m']
permissions:
  contents: read
concurrency:
  group: scan-l1a
  cancel-in-progress: false
jobs:
  scan:
    name: L1A download and CRN comparison
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out gracefoReading
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/gracefoReading
          ref: v1.1.0
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          path: deps/gracefoReading

      - name: Scan
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        env:
          READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
        with:
          command: addpath(genpath('deps/gracefoReading')); addpath(pwd); addpath('tools'); scanL1A(getenv('READING_DATA_POOL'), "2020-01-02")

      - name: Publish scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: l1a-scan
          path: artifacts/
